name: PageGoat Linux Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pagegoat-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to Google VM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake make libcurl4-openssl-dev

      - name: Configure
        run: |
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-linux --parallel 2

      - name: Verify binaries
        run: |
          test -x build-linux/pagegoat
          test -x build-linux/pagegoat-service
          ldd build-linux/pagegoat-service

          if ldd build-linux/pagegoat-service | grep -q "not found"; then
            echo "Missing runtime dependency"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagegoat-linux
          path: build-linux/pagegoat-service
          retention-days: 7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/pagegoat_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/pagegoat_deploy
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/pagegoat_deploy > /dev/null

      - name: Test SSH connection
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -vv \
            -p "$PORT" \
            -i ~/.ssh/pagegoat_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "echo 'SSH connection successful'; whoami"

      - name: Transfer service binary
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp \
            -P "$PORT" \
            -i ~/.ssh/pagegoat_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            build-linux/pagegoat-service \
            "$USER@$HOST:/tmp/pagegoat-service"

      - name: Install and restart PageGoat
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh \
            -p "$PORT" \
            -i ~/.ssh/pagegoat_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "sudo -n /usr/bin/install -o $USER -g $USER -m 0755 /tmp/pagegoat-service /home/$USER/pagegoat/build-linux/pagegoat-service &&
             sudo -n /usr/bin/systemctl restart pagegoat &&
             sudo -n /usr/bin/systemctl is-active pagegoat &&
             rm -f /tmp/pagegoat-service"
