
name: PageGoat Oracle Linux 9 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: oraclelinux:9

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install gcc gcc-c++ cmake make openssl-devel zlib-devel pkgconf-pkg-config tar gzip git curl
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build compatible libcurl
        run: |
          curl -fL https://curl.se/download/curl-8.12.1.tar.gz -o /tmp/curl.tar.gz
          tar -xzf /tmp/curl.tar.gz -C /tmp
          cd /tmp/curl-8.12.1
          ./configure --prefix=/opt/pagegoat-curl --with-openssl --with-zlib --disable-shared --enable-static --without-libpsl --without-brotli --without-zstd --without-nghttp2
          make -j2
          make install

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH=/opt/pagegoat-curl/lib/pkgconfig
          pkg-config --modversion libcurl
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCURL_INCLUDE_DIR=/opt/pagegoat-curl/include \
            -DCURL_LIBRARY=/opt/pagegoat-curl/lib/libcurl.a

      - name: Build existing targets
        run: |
          cmake --build build-linux --parallel 2

      - name: Verify Linux binaries
        run: |
          file build-linux/pagegoat
          file build-linux/pagegoat-service
          ldd build-linux/pagegoat-service
          ldd build-linux/pagegoat-service | grep "not found" && exit 1 || true

      - name: Package service binary
        run: |
          mkdir -p pagegoat-linux
          cp build-linux/pagegoat-service pagegoat-linux/
          tar -czf pagegoat-linux.tar.gz -C pagegoat-linux .

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagegoat-oracle-linux-9
          path: pagegoat-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
