
name: PageGoat Oracle Linux 9 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: oraclelinux:9

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install gcc gcc-c++ cmake make libcurl-devel pkgconf-pkg-config tar gzip
          rpm -q libcurl libcurl-devel
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build existing targets
        run: |
          cmake --build build-linux --parallel 2

      - name: Verify Linux binaries
        run: |
          file build-linux/pagegoat
          file build-linux/pagegoat-service
          ldd build-linux/pagegoat-service
          ldd build-linux/pagegoat-service | grep "not found" && exit 1 || true

      - name: Package service binary
        run: |
          mkdir -p pagegoat-linux
          cp build-linux/pagegoat-service pagegoat-linux/
          tar -czf pagegoat-linux.tar.gz -C pagegoat-linux .

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagegoat-oracle-linux-9
          path: pagegoat-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
